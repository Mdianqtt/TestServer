  - isblocking false
  Skills:
  - damage{a=10;pkb=false;hnp=false;hp=true}
  - heal{amount=5} @self
  
Plant_Monster_Hit:
  Cooldown: 1
  Skills:
  - effect:sound{s=rms_dark_forest_sounds:samus.plant_monster_idle;volume=1;pitch=1.2} @self