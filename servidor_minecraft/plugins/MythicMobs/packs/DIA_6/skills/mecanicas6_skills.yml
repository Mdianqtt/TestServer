PlumaVacio_Teleport_Puro:
  Cooldown: 3 # Subimos un pelín el cooldown para que la física del dash no se vuelva loca
  Skills:
  # 1. Efectos de salida
  - sound{s=entity.enderman.teleport;p=1.5;v=1} @self
  - effect:particles{p=portal;amount=15;hS=0.5;vS=1;speed=0.2} @self

  # 2. EL TELETRANSPORTE (Máximo 15 bloques)
  - teleport{ignorewalls=false} @TargetLocation{maxDistance=15}

  # 3. EL DASH DE INERCIA (Lo que evita que te quedes quieto)
  # Un pequeño delay de 1 tick para que el server te ubique antes de lanzarte
  - delay 1
  - velocity{x=0;y=0.2;z=0;force=true} @self
  - leap{velocity=250} @Forward{length=9}

  # 4. Efectos de llegada
  - effect:particles{p=dragon_breath;amount=20;hS=0.5;vS=1;speed=0.1} @self
  - sound{s=block.enchantment_table.use;p=2;v=1} @self
  - potion{type=SLOW_FALLING;duration=40;level=0;showParticles=false} @self


 # VOID SPHERE-------------------------


Void_Missile_Final:
  Skills:
  - sound{s=entity.wither.shoot;p=1.5;v=1} @self
  - projectile{
      onTick=Void_Ray_Tick;
      onHit=Void_Impacto;
      onHitBlock=Void_Impacto;
      v=20;
      i=1;
      mr=30;
      hR=0.5;
      vR=0.5;
      hp=false; 
      stopatentity=true;
      ignorepassable=true;
    } @Forward{length=30}

Void_Ray_Tick:
  Skills:
  - effect:particles{p=squid_ink;amount=8;hS=0.1;vS=0.1;speed=0.01} @origin
  - effect:particles{p=portal;amount=5;hS=0.1;vS=0.1;speed=0.05} @origin

Void_Impacto:
  Skills:
  # 1. ELIMINAR CUALQUIER EMPUJE PREVIO (Fundamental)
  - velocity{set;x=0;y=0;z=0} @EntitiesNearOrigin{r=7;ignore=players}
  
  # 2. SUCCIÓN HACIA ABAJO (vVelocity negativa es la clave)
  # Esto evita que el impacto desde arriba los mande volando
  - pull{velocity=7;vVelocity=-2;toOrigin=true} @EntitiesNearOrigin{r=8;ignore=players}
  - sound{s=entity.enderman.stare;p=0.5;v=2} @origin
  
  # Efecto visual del área
  - effect:particles{p=portal;amount=60;hS=0.5;vS=0.1;speed=0.5} @RingAroundOrigin{r=4;points=30}

  - delay 12 # Esperamos a que todos estén pegados en el centro

  # 3. DAÑO "PESADO" (Sin knockback para que no se dispersen)
  - damage{a=12;ignoreArmor=true;preventKnockback=true} @EntitiesNearOrigin{r=5;ignore=players}
  - effect:particles{p=large_smoke;amount=40;hS=0.8;vS=0.8} @origin

  - delay 2

  # 4. EXPLOSIÓN FINAL (Vuelan por los aires)
  - sound{s=entity.generic.explode;p=0.5;v=2} @origin
  # El throw ahora sí los lanza hacia arriba con fuerza
  - throw{fromOrigin=true;velocityY=15;velocity=8} @EntitiesNearOrigin{r=6;ignore=players}
  - effect:particles{p=explode;amount=30;hS=1;vS=1} @origin


# PRISMASPQIUE-------------------------

Psique_Velo:
  Cooldown: 3
  Skills:
  # 1. ESTADO ETÉREO (Invisibilidad y velocidad)
  - potion{type=SPEED;duration=60;level=2;showParticles=false} @self
  - potion{type=INVISIBILITY;duration=60;level=0;showParticles=false} @self
  - sound{s=entity.allay.item_thrown;p=1.5;v=1} @self

  # 2. EL AURA DE REPULSIÓN
  - aura{
      n=VeloMariposa;
      d=60; 
      onTick=Psique_Tick;
      onEnd=Psique_Explosion
    } @self

Psique_Tick:
  Skills:
  # --- EFECTO DE REPULSIÓN (Campo de fuerza) ---
  # El pull con velocidad negativa funciona como un empuje constante
  # Es más suave que el comando 'throw' y no interrumpe el movimiento
  - pull{velocity=-4;vVelocity=0.2} @EntitiesInRadius{r=7;ignore=players}
  
  # Visual de las alas de la mariposa mientras caminas
  - effect:particles{p=end_rod;amount=2;hS=0.1;vS=0.1;speed=0.01} @self
  - effect:particles{p=reddust;color=#00BFFF;amount=5;hS=0.2;vS=0.2} @self

Psique_Explosion:
  Skills:
  # El gran final cuando recuperas tu forma
  - sound{s=block.glass.break;p=1.5;v=2} @self
  - effect:particles{p=reddust;color=#F0F8FF;amount=50;r=3} @self
  
  # Daño de área final y un último empuje fuerte
  - damage{a=20;ignoreArmor=true} @EntitiesInRadius{r=8;ignore=players}
  - throw{velocity=10;velocityy=6;fromOrigin=true} @EntitiesInRadius{r=5;ignore=players}


  # RAICES-------------------------

Plaga_Explosion_Raices:
  Skills:
  # 1. Tú golpeas el suelo (Efecto inicial en ti)
  - effect:particles{p=block;m=dirt;amount=20;hS=0.5;vS=0.1;speed=0.1} @self
  - sound{s=block.moss.break;p=0.5;v=2} @self

  # 2. Las raíces "viajan" (Llamamos a la skill con delay dinámico)
  # Esto detecta a los mobs y les manda la skill individual
  - skill{s=Plaga_Castigo_Viajero} @EntitiesInRadius{r=8;ignore=players}

Plaga_Castigo_Viajero:
  Skills:
  # --- EL TRUCO DEL VIAJE ---
  # 'delayInTicks' hará que los mobs lejanos sientan el efecto más tarde que los cercanos.
  # No es perfecto, pero simula que la raíz está "llegando" a ellos.
  
  # Partículas en el suelo entre tú y el enemigo (simulación de rastro)
  - effect:particleline{p=composter;zigzag=true;amount=10;vS=0.1;hS=0.1;count=1;speed=0.4;fromorigin=true} @EntitiesInRadius{r=8;ignore=players}
  
  # 3. EL IMPACTO (Con un pequeño delay para que dé tiempo a ver el rastro)
  - delay 2

  # Inmovilizar y visual de raíces brotando
  - potion{type=SLOW;duration=100;level=10}
  - sound{s=block.wood.break;p=0.7;v=1}
  
  # Partículas constantes mientras están atrapados (la "prisión")
  - effect:particles{p=happy_villager;amount=10;hS=0.5;vS=1;repeat=19;repeatInterval=5}
  
  # Daño por ticks
  - damage{a=3;preventKnockback=true;repeat=4;repeatInterval=20}
  - effect:particles{p=block;m=oak_log;amount=10;hS=0.3;vS=0.3;repeat=4;repeatInterval=20}

Plaga_Castigo_Individual:
  Skills:
  # 1. Inmovilizar
  - potion{type=SLOW;duration=100;level=10}
  
  # 2. SEÑAL VISUAL DE "ATRAPADO" (Partículas constantes alrededor del mob)
  # Usamos 'p=dust' con color verde (si tu versión lo permite) o 'happy_villager'
  # El hS=0.5 y vS=1 crea una "columna" de partículas sobre el enemigo
  - effect:particles{p=happy_villager;amount=15;hS=0.6;vS=1;speed=0.05;repeat=20;repeatInterval=5}
  - effect:particles{p=spore_blossom_air;amount=5;hS=0.4;vS=1;repeat=20;repeatInterval=5}

  # 3. DAÑO Y SONIDO DE CRUJIDO (Cada segundo)
  - damage{a=3;preventKnockback=true;repeat=4;repeatInterval=20}
  - sound{s=block.wood.break;p=0.5;v=0.4;repeat=4;repeatInterval=20}
  - effect:particles{p=composter;amount=20;hS=0.5;vS=0.2;repeat=4;repeatInterval=20}