mf_snake_year_beast:
  Type: husk
  Display: '&4Snake'
  Health: 450
  Damage: 1 
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Modules:
    ThreatTable: true
  Options:
    AlwaysShowName: false
    PreventOtherDrops: true
    Silent: true
    FollowRange: 50
    PreventItemPickup: true
    PreventRandomEquipment: true
    MovementSpeed: 0.001
    KnockbackResistance: 1
    PreventJockeyMounts: true
    NoAI: false
  BossBar:
    Enabled: true
    Title: '&4Snake'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  Skills:  
  - gcd{ticks=60} @self ~onSpawn
  - HitboxConfig{modelid=snake_year_beast;partid=hitbox;pass=0} @self ~onSpawn
  - model{mid=snake_year_beast;usestatemachine=true;scale=1} @self ~onSpawn
  - bodyclamp{m=snake_year_beast;c=20;mh=0;rdu=10;rde=0} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  
  - randomskill{s=mf_snake_year_beast_smash,mf_snake_year_beast_swep,mf_snake_year_beast_flame,mf_snake_year_beast_stick} @target ~onTimer:20
  
  - skill{s=mf_snake_year_beast_death} @self ~onDeath


mf_snake_year_beast_phase2:
  Type: husk
  Display: '&4Snake'
  Health: 1600
  Damage: 10
