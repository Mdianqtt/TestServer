  - model{mid=snake_year_beast_phase2;usestatemachine=true;scale=1} @self ~onSpawn
  - bodyclamp{m=snake_year_beast_phase2;c=0;mh=0;rdu=10;rde=0} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onAttack
  
  - randomskill{s=mf_snake_year_beast_phase2_attack1,mf_snake_year_beast_phase2_attack2,mf_snake_year_beast_phase2_attack3,mf_snake_year_beast_phase2_dodge} @target ~onTimer:20
  - skill{s=mf_snake_year_beast_phase2_skill_random} @target ~onTimer:20
  - skill{s=mf_snake_year_beast_death2} @self ~onDeath
  - skill{s=snake_title} @self ~ondeath
  


