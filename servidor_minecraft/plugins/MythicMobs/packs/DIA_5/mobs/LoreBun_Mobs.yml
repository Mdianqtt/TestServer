lorebun:
  Type: IRON_GOLEM
  Display: '&d&lMagic Bunny'
  Faction: lorebun
  Health: 1850
  Damage: 0
  DamageModifiers:
  - FALL 0.02
  - PROJECTILE 0.3
  - ENTITY_ATTACK 0.7
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Modules:
    ThreatTable: true
  BossBar:
    Enabled: true
    Title: '<bold><gold>MAGIC BUNNY'
    Color: YELLOW
    Style: SEGMENTED_6
  Options:
    NoDamageTicks: 1
    MovementSpeed: 0.33
    FollowRange: 64
    KnockbackResistance: 1
    Silent: true
    Despawn: false
    Invincible: false
    Invisible: true
    PreventSunburn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MaxCombatDistance: 30
  Skills:
  - clearThreat{} @self ~onTimer:120
  - model{mid=lorebun;n=false;tint=true;h=true} @self ~onSpawn
  - randomskill{s=lorebun_time_walk,lorebun_throw_portal,lorebun_shoot_clock,lorebun_cblade,lorebun_ult} @target ~onTimer:20
  - skill{s=lorebun_combo_start} @target ~onTimer:20
  - skill{s=lorebun_dash} @target ~onTimer:30
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=lorebun_timeback_check} @PiR{r=40;sort=LOWEST_HEALTH;limit=1} ~onTimer:400
  - sound{s=minecraft:entity.rabbit.hurt;p=0.8;v=2;sc=HOSTILE} @self ~onDamaged .50
  - skill{s=lorebun_hit_arrow} @self ~onDamaged
  - sound{s=minecraft:entity.rabbit.death;p=0.8;v=2;sc=HOSTILE} @self ~onDeath
  - skill{s=lorebun_title} @self ~ondeath

