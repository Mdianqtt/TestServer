EtherealReaver_Passive:
  # 'chance' NO es una mecánica, es una condición que debe ir aquí:
  Conditions:
  - chance{c=0.3}
  Skills:
  - skill{s=EtherealReaver_OrbitalEffect} @target
  - sound{s=entity.enderman.teleport;p=1.5;v=0.5} @target

EtherealReaver_OrbitalEffect:
  Skills:
  # 1. El efecto visual (sigue durando 3 segundos)
  - orbital{
      bulletType=MOB;
      mob=ethereal_reaver_beam;
      points=20;
      interval=1;
      duration=60;
      charges=100;
      oy=0.5;
      r=1.5;
      vhr=2
    } @target
  
  # 2. El daño (Ajustado para 2 impactos)
  - aura{
      i=30;
      d=61;      
      onTick=EtherealReaver_PassiveDamage;
    } @target

EtherealReaver_PassiveDamage:
  Skills:
  - damage{amount=4;ignoreArmor=true}
  - effect:particles{p=witch;amount=5;speed=0.1;hS=0.2;vS=0.2} @self

 #WATCHER EYE------------------------

Watcher_Active:
  Cooldown: 5
  Skills:
  # 1. Sonido de activación y partículas en el jugador
  - sound{s=entity.ender_eye.death;p=0.5;v=1} @self
  - effect:particles{p=happy_villager;amount=20;hS=2;vS=2} @self

  # 2. MARCAR: Todos en 15 bloques brillan
  - potion{type=GLOWING;duration=100;level=1} @EntitiesInRadius{r=15;ignore=@Players}

  # 3. CASTIGAR: Después de 10 ticks (0.5s), daño a los que brillan
  - delay 10
  - skill{s=Watcher_Impact} @EntitiesInRadius{r=15;ignore=@Players}
  - consumeuseditem @self

Watcher_Impact:
  Skills:
  # Solo hace daño si el enemigo tiene el efecto de Glowing (para no fallar)
  - damage{amount=8;ignoreArmor=false}
  - potion{type=SLOW;duration=40;level=5}
  
  # Efecto visual: Un haz de luz verde que cae sobre cada mob
  - effect:particles{p=dust;color=85,255,85;amount=30;speed=1;hS=0.2;vS=2} @target
  - sound{s=entity.zombie_villager.converted;p=2;v=1} @target

