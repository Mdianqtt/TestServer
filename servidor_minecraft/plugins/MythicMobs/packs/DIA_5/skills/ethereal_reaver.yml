#### TELEPORT ####

ethereal_reaver_teleport:
  Cooldown: 3
  Conditions:
  - incombat true
  - stance{s=beams} false
  - targetnotwithin{d=16} true
  - offgcd true
  Skills:
  - lockmodel{l=true} @self
  - effect:particles{particle=flash;amount=1} @self
  - teleport{spreadh=5;spreadv=0} @target
  - effect:particles{particle=flash;amount=1} @self
  - sound{s=littleroom_etherealreaver:littleroom.etherealreaver.teleport;v=1;sc=HOSTILE} @self
  - delay 10
  - lockmodel{l=false} @self
  
#### DASH ####

ethereal_reaver_dash:
  Cooldown: 3
  Conditions:
  - incombat true
  - stance{s=beams} false
  - targetnotwithin{d=8} true
  - targetwithin{d=12} true
  - offgcd true
  Skills:
  - gcd{ticks=5}
  - state{s=dash} @self
  - delay 3
  - sound{s=littleroom_etherealreaver:littleroom.etherealreaver.dash;v=1;sc=HOSTILE} @self
  - throw{v=2;vy=6;repeat=5;repeatInterval=1} @pir{r=2}
  - lunge{v=4;vy=0} @forward{f=6}
  - lockmodel{l=true} @self
  - delay 15
  - lockmodel{l=false} @self
  
  
