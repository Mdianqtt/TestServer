skeleboss_rswipe:
  Cooldown: 4
  Conditions:
  - targetwithin{d=7} true
  - offgcd
  Skills:
  - gcd{ticks=80}
  - potion{type=SLOWNESS;duration=30;level=1} @self
  - state{state=atk_rswipe;n=false;speed=1} @Self

  - sound{s=minecraft:entity.skeleton.step;v=2;p=0.1;delay=15} @self
  - sound{s=minecraft:entity.skeleton.converted_to_stray;v=1.5;p=0.5;delay=27} @self
  - sound{s=minecraft:item.trident.hit;v=1.5;p=0.1;delay=25} @self

  - throw{v=8;yv=5;delay=26} @LivingInCone{a=180;r=6}
  - damage{a=<mob.damage>*1.8;delay=25} @LivingInCone{a=180;r=6}

