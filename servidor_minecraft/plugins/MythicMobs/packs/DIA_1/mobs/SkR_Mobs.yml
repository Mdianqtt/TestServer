skr_barebone:
  Template: SkR_Skeleton_Base
  Health: 20
  Skills:
  - model{m=skr_barebone;usm=true} @self ~onSpawn
  - skill{s=SkR_SunBurn} ~onDamaged
  ##======[Animation States]=======
  - Aura{
    auraName=inCombat;
    onStart=[
        - auraremove{aura=sunBurning} @self
        - defaultstate{m=skr_barebone;t=IDLE;s=idle} @self
        - defaultstate{m=skr_barebone;t=WALK;s=walk} @self
        ];
    duration=9999;
    mergeAll=true} @self ~onEnterCombat
  - auraremove{aura=inCombat} @self ~onDropCombat
  ##======[Combat Abilities]=======
  - skill{s=SkR_Barebone_Melee;sync=true} ~onAttack

