skr_ranger:
  Template: SkR_Skeleton_Base
  Health: 20
  Equipment:
  - BOW HAND
  Skills:
  - model{m=skr_ranger;usm=true} @self ~onSpawn
  - partvis{m=skr_ranger;p=arrow} @self ~onSpawn
  - partvis{m=skr_ranger;p=hood} @self ~onSpawn 0.5
  - skill{s=SkR_SunBurn} ~onDamaged
  ##======[Animation States]=======
  - Aura{
    auraName=inCombat;
    onStart=[
        - auraremove{aura=sunBurning} @self
        - defaultstate{m=skr_ranger;t=IDLE;s=combat_walk} @self
        - defaultstate{m=skr_ranger;t=WALK;s=combat_walk} @self
        - partvis{m=skr_ranger;p=arrow;v=true} @self
        - addtag{t=sprint} @self
        ];
    onEnd=[
        - defaultstate{m=skr_ranger;t=IDLE;s=idle} @self
        - defaultstate{m=skr_ranger;t=WALK;s=walk} @self
        - partvis{m=skr_ranger;p=arrow} @self
        ];
    duration=9999;
    mergeAll=true} @self ~onEnterCombat
  - auraremove{aura=inCombat} @self ~onDropCombat
  - skill{s=SkR_Ranger_WalkState} ~onTimer:5
  ##======[Combat Abilities]=======
  - CancelEvent{sync=true} ~onAttack
  - skill{s=SkR_Ranger_Shoot;sync=true} ~onShoot

