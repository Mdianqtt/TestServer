### MIMIC ###
vp1_mimic_chest:
  Type: ARMOR_STAND 
  Display: 'mimic_chest'
  AITargetSelectors:
  - clear
  AIGoalSelectors:
  - clear
  Options:
    Despawn: false
    PreventOtherDrops: true
    KnockbackResistance: 1
    Collidable: false
    Silent: true
    Persistent: true
    Invincible: true
  DamageModifiers:
    - SUFFOCATION -1
  Skills:
  - model{mid=vp1_mimic;n=false;d=false;usm=true;h=false} @self ~onSpawn
  - model{mid=vp1_mimic;n=false;d=false;usm=true;h=false} @self ~onLoad
  - BodyClamp{mh=0;mb=0;rde=0;rdu=0} @self ~onSpawn
  - BodyClamp{mh=0;mb=0;rde=0;rdu=0} @self ~onLoad
  - submodel{model=vp1_mimic;subpart=mimic;em=false;remove=true} @self ~onSpawn
  - skill{s=vp1_mimic_1block_SPAWN} @selflocation{y=.5;centered=true} ~onSpawn
  - skill{s=vp1_mimic_hideparts} @self ~onSpawn
  - skill{s=vp1_mimic_random_rotation} @self ~onSpawn
  - skill{s=vp1_mimic_awaken} @self ~onInteract
  - skill{s=vp1_mimic_1block_errorprevention} @selflocation ~onTimer:1
  - setblock{m=AIR;md=0} @selflocation{y=.5} ~onDeath
  
vp1_mimic_chest_awaken:
  Type: RAVAGER
  Display: 'Mimic'
  Health: 15
  Modules:
    ThreatTable: true
  AITargetSelectors:
  - players
  Options:
    MovementSpeed: .25
    PreventOtherDrops: true
    Despawn: true
    Persistent: false
    KnockbackResistance: 1
    Collidable: true
    Silent: false
    FollowRange: 64
    PreventSunburn: true  
  Skills:
  - model{mid=vp1_mimic;n=false;d=false;usm=true} @self ~onSpawn
  - model{mid=vp1_mimic;n=false;d=false;usm=true} @self ~onLoad
  - BodyClamp{mh=0;mb=0;rde=0;rdu=0} @self ~onSpawn
  - BodyClamp{mh=0;mb=0;rde=0;rdu=0} @self ~onLoad
  - skill{s=vp1_mimic_attack_sync;sync=true} @self ~onAttack
  - effect:particles{p=cloud;hs=.65;vs=.65;a=25} @selflocation{y=.5} ~onDeath
  - skill{s=vp1_mimic_awaken_spawn} @self ~onSpawn
  
  
  
  
