### SHARK ###

vp1_reef_shark:
  Type: DOLPHIN  
  Display: "Reef Shark"
  Health: 25
  AITargetSelectors:
  - players
  AIGoalSelectors:
  - meleeattack
  Modules:
    ThreatTable: true
  Damage: 1
  Options:
    Silent: true
    PreventOtherDrops: true
    KnockbackResistance: 1
    FollowRange: 32
    Despawn: false
  Drops:
  - reefshark_tooth 1 1
  Skills:
  - CancelEvent @self ~onInteract
  - model{m=vp1_reef_shark;usm=true;step=1;lp=true;h=true} @self ~onSpawn
  - model{m=vp1_reef_shark;usm=true;step=1;lp=true;h=true} @self ~onLoad
  - BodyClamp{mh=15;mb=15;rde=60;rdu=60} @self ~onSpawn
  - BodyClamp{mh=15;mb=15;rde=60;rdu=60} @self ~onLoad
  - skill{s=vp1_reef_shark_cancel_meleeattack} @self ~onTimer:1
  - skill{s=vp1_reef_shark_bite} @self ~onTimer:5
  - skill{s=vp1_reef_shark_bite_close} @self ~onTimer:5
  - skill{s=vp1_reef_shark_player_aggro} @pir{r=16} ~onTimer:10
  - skill{s=vp1_reef_shark_death} @self ~onDeath
  - CancelEvent{sync=true} @self ~onAttack




### RHINO BEETLE ###

vp1_rhino_beetle:
  Type: IRON_GOLEM
  Health: 15
  Display: "Rhino Beetle"
  Options:
    Silent: true
    PreventOtherDrops: true
    Despawn: false
  Drops:
  - rhinobeetle_horn 1 1
  Skills:
  - CancelEvent @self ~onInteract
  - model{m=vp1_rhino;usm=true;step=1;lp=true;h=true} @self ~onSpawn
  - model{m=vp1_rhino;usm=true;step=1;lp=true;h=true} @self ~onLoad
  - BodyClamp{mh=15;mb=15;rde=60;rdu=60} @self ~onSpawn
  - BodyClamp{mh=15;mb=15;rde=60;rdu=60} @self ~onLoad
  - sound{s=littleroom_varietypackvol1:littleroom.varietypackvol1.rhinobeetle_fly;v=1;sc=HOSTILE;cd=1} @self ~onTimer:1 ?stance{s=flying}
  - state{s=wing_flick;p=2} @self ~onTimer:60 .5 ?!stance{s=flying} #this adds variety to the animations except for when flying#
  - skill{s=vp1_rhino_beetle_attack_sync;sync=true} @self ~onAttack
  - skill{s=vp1_rhino_beetle_in_air} @self ~onTimer:1 ?!onground 
  - skill{s=vp1_rhino_beetle_land} @self ~onTimer:1 ?onground 
  - skill{s=vp1_rhino_beetle_fly_away} @self ~onTimer:1 ?onground
  - skill{s=vp1_rhino_beetle_closegap} @self ~onTimer:1 ?onground
  - skill{s=vp1_rhino_beetle_death} @self ~onDeath
  
  
  
  
