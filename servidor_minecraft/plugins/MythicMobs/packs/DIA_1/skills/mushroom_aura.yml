SecuenciaVeneno_PINK:
  Cooldown: 5 # <--- IMPORTANTE: La seta no volverá a atacar hasta pasar 5 segundos
  Conditions:
  - playerWithin{d=5} true
  Skills:
  # 1. EL AVISO (Solo una vez)
  - effect:particles{p=dust_color_transition;color=255,100,255;amount=40;speed=0.05;hS=0.8;vS=1;size=1.2} @self
  - effect:particles{p=enchant;amount=20;hS=1;vS=2} @self
  - sound{s=entity.allay.item_taken;p=0.5;v=1} @self
  
  - delay 15
  
  # 2. LA EXPLOSIÓN (Solo una vez)
  - skill{s=ExplosionEsporas_PINK} @self

ExplosionEsporas_PINK:
  Skills:
  # Combinación de 3 partículas a la vez en un solo golpe visual
  - effect:particles{p=dust;color=255,0,150;amount=100;speed=0.2;hS=2.5;vS=1.5;size=1.6} @self
  - effect:particles{p=dragon_breath;amount=40;speed=0.05;hS=2;vS=1} @self
  
  - sound{s=entity.puffer_fish.blow_out;p=0.5;v=2} @self
  
  # Daño único
  - damage{amount=4;ignoreArmor=false} @PlayersInRadius{r=5}
  - potion{type=POISON;duration=120;level=2} @PlayersInRadius{r=5}



