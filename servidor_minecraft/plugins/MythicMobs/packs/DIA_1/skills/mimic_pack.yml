mimic_awaken_spawn:
  Skills:
  - delay 1
  - sound{s=littleroom_mimic:littleroom.mimic.awaken;v=1;sc=HOSTILE;p=<random.float.0.8to1.2>} @self
  - propel{v=.5} @pir{r=5;sort=NEAREST;limit=1}
  - state{s=alive;p=2} @self
  - defaultstate{type=idle;state=alive_idle} @self

mimic_attack_sync:
  Skills:
  - CancelEvent
  - skill{s=mimic_attack} @self
  
mimic_attack:
  Cooldown: 1
  Skills:
  - state{s=attack} @self
  - propel{v=.25} @forward
  - delay 5  
  - totem{md=2;oH=mimic_attack_damage;hR=1;vR=1;repeat=5;repeatInterval=1} @forward{f=1}

mimic_attack_damage:
  Skills:
  - damage{a=1}
  - throw{v=2}