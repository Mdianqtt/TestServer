  - speak{offset=1f;radius=30;maxlinelength=22;lineprefix="&f";message="ROTATING...";chatprefix="";duration=20;chat=false} @self
  - modifytargetscore{o=rotate;a=add;v=1} @self
  
mimic_rotate_reset:
  Skills:
  - settargetscore{o=rotate;v=0} @self
  
mimic_rotatecheck:
  Skills:
  - skill{s=mimic_north} @self
  - skill{s=mimic_east} @self
  - skill{s=mimic_south} @self
  - skill{s=mimic_west} @self
  
mimic_north:
  Conditions:
  - score{o=rotate;v=1} true
  Skills:
  - setrotation{relative=false;yaw=0;pitch=0} @Self
  
mimic_east:
  Conditions:
  - score{o=rotate;v=2} true
  Skills:
  - setrotation{relative=false;yaw=-90;pitch=0} @Self
  
mimic_south:
  Conditions:
  - score{o=rotate;v=3} true
  Skills:
  - setrotation{relative=false;yaw=180;pitch=0} @Self
  
mimic_west:
  Conditions:
  - score{o=rotate;v=4} true
  Skills:
  - setrotation{relative=false;yaw=90;pitch=0} @Self
  
  
  
