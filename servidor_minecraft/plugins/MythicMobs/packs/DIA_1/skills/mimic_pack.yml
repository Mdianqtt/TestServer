## TWO BLOCK SPECIFIC SKILLS ##
  
mimic_2block_SPAWN:
  TargetConditions:
  - blocktype{type=air} castinstead mimic_2block_SPAWNto2
  Skills:
  - dropitem{i=<caster.name>} @self
  - remove @self
  
mimic_2block_SPAWNto2:
  Skills:
  - skill{s=mimic_2block_SPAWN2} @selflocation{y=.5;centered=true}
  
mimic_2block_SPAWN2:
  Conditions:
  - blocktype{type=air}
  Skills:
  - delay 1
  - setowner @pir{r=7;sort=NEAREST;limit=1}
  - teleport{} @selflocation{centered=true}
  - setblock{m=BARRIER;md=0} @selflocation{centered=true}
  - setblock{m=BARRIER;md=0} @selflocation{fo=1;centered=true}
  - settargetscore{o=rotate;v=1} @self
  - bodyclamp{mh=0;mb=0} @self

mimic_2block_errorprevention:
  #Cooldown: 1
  Conditions:
  - ismoving orElseCast mimic_2block_errorprevention2
  Skills:
  - setblock{m=AIR;md=0} @selflocation{y=.5}
  - setblock{m=AIR;md=0} @selflocation{fo=1;y=.5;centered=true}
  - dropitem{i=<caster.name>} @self
  - remove @self
  
mimic_2block_errorprevention2:
  Conditions:
  - blocktype{type=air}
  Skills:
  - setblock{m=AIR;md=0} @selflocation{y=.5}
  - setblock{m=AIR;md=0} @selflocation{fo=1;y=.5;centered=true}
  - dropitem{i=<caster.name>} @self
  - remove @self
 
mimic_2block_errorprevention3:
  Conditions:
  - blocktype{type=barrier} false
  Skills:
  - dropitem{i=<caster.name>} @self
  - remove @self
  
mimic_2block_rotate:
  Cooldown: 1
  TargetConditions:
  - blocktype{type=air} orElseCast mimic_2block_flip
  TriggerConditions:
  - crouching true
  Conditions:
  - score{o=rotate;v=>3} castinstead mimic_rotate_reset
  Skills:
  - setblock{m=AIR;md=0} @selflocation{fo=1;y=.5;centered=true}
  - speak{offset=1f;radius=30;maxlinelength=22;lineprefix="&f";message="ROTATING...";chatprefix="";duration=20;chat=false} @self
  - modifytargetscore{o=rotate;a=add;v=1} @self
  - delay 10
  - setblock{m=BARRIER;md=0} @selflocation{fo=1;y=.5;centered=true}
  
mimic_2block_flip:
  Skills:
  - setblock{m=AIR;md=0} @selflocation{fo=1;y=.5;centered=true}
  - modifytargetscore{o=rotate;a=add;v=2} @self
  - delay 10
  - setblock{m=BARRIER;md=0} @selflocation{fo=1;y=.5;centered=true}
  
