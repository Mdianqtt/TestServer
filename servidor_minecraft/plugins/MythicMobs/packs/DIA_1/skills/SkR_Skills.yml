SkR_ShieldBlock:
  TriggerConditions:
  - fieldofview{angle=90}
  Conditions:
  - hastag{t=noShield} false
  - score{o=blockCount;v=<2} castinstead SkR_ShieldDrop
  Skills:
  - CancelEvent
  - gcd{t=30}
  - sound{s=item.shield.block} @self
  - modifymobscore{o=blockCount;a=SUBTRACT;v=1}

SkR_ShieldDrop:
  Skills:
  - CancelEvent
  - addtag{t=noShield} @self
  - sound{s=item.shield.break} @self
  - potion{t=SLOW;d=15;l=10;p=false} @self
  - state{s=drop_shield;lo=3} @self
  - partvis{m=skr_skirmisher;p=shield} @self
  - particles{p=item_crack;m=SHIELD;a=10;spread=0.3} @ModelPart{m=skr_skirmisher;p=shield}

