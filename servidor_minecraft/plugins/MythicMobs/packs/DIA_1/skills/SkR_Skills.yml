SkR_SunBurn:
  Conditions:
  - incombat{} false
  - (day{} || dawn{})
  - (burning{} && outside{})
  Skills:
  - Aura{
    auraName=sunBurning;
    onStart=[
        - defaultstate{m=<caster.mythic_type>;t=IDLE;s=burn_walk;li=5;lo=5} @self
        - defaultstate{m=<caster.mythic_type>;t=WALK;s=burn_walk;li=5;lo=5} @self
        ];
    onTick=[
        - skill{s=SkR_SunBurn_Check} @self
        ];
    onEnd=[
        - defaultstate{m=<caster.mythic_type>;t=IDLE;s=idle;li=5;lo=5} @self
        - defaultstate{m=<caster.mythic_type>;t=WALK;s=walk;li=5;lo=5} @self
        ];
    duration=9999;
    mergeAll=true} @self

SkR_SunBurn_Check:
  Conditions:
  - incombat{} false
  - hasAura{n=sunBurning}
  - (inside{} || burning{} false)
  Skills:
  - auraremove{aura=sunBurning} @self

