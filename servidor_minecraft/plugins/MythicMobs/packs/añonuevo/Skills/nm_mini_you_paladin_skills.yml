### Standard Stab Attack

mini_you_paladin_stab_parse:
  Skills:
  - CancelEvent
  - skill{s=mini_you_paladin_stab_activate;cd=2}
  
mini_you_paladin_stab_activate:
  Conditions:
  - offgcd
  Skills:
  - gcd{ticks=20}
  - freeze{ticks=24} @self 
  - look{headOnly=false;immediately=true} @target  
  - state{state=stab;li=2;lo=4;n=false;speed=1} @self
  
  - delay 2
  - sound{s=entity.witch.throw;p=0.6;v=0.1} @self
  
  - delay 10
  - sound{s=item.axe.scrape;p=1.7;v=0.6} @self
  - damage{a=7}
  
