### Parry Ability

mini_you_paladin_parry_parse:
  Conditions:
  - chance{chance=0.5} orElseCast mini_you_paladin_hurt_parse
  Skills:
  - CancelEvent
  - skill{s=mini_you_paladin_parry_activate;cd=2}
  
mini_you_paladin_parry_activate:
  Conditions:
  - offgcd
  Skills:
  - gcd{ticks=30}
  - freeze{ticks=24} @self 
  - look{headOnly=false;immediately=true} @target  
  - state{state=parry;li=2;lo=4;n=false;speed=1} @self
  
  - delay 2
  - sound{s=entity.witch.throw;p=0.6;v=0.1} @self
  
  - delay 10
  - sound{s=block.anvil.land;p=0.7;v=0.1} @self
  - effect:particles{particle=fireworks_spark;yOffset=0.5;a=5;spread=0.2;hSpread=0.2} @target
  - damage{a=3}