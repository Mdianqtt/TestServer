### Standard Shoot Attack

mini_you_archer_shoot_parse:
  Skills:
  - CancelEvent
  - skill{s=mini_you_archer_shoot_activate;cd=1.0}
  
mini_you_archer_shoot_activate:
  Conditions:
  - offgcd
  - chance{chance=0.9} orElseCast mini_you_archer_potion_activate
  Skills:
  - gcd{ticks=30}
  - freeze{ticks=24} @self 
  - look{headOnly=false;immediately=true} @target  
  - state{state=shoot;li=2;lo=4;n=false;speed=1} @self
  
  - delay 4
  - sound{s=item.crossbow.loading_middle;p=1.4;v=0.2} @self
  
  - delay 16
  - sound{s=item.crossbow.shoot;p=1.4;v=0.6} @self
  - shoot{type=arrow;damage=6;velocity=1.8;accuracy=2.0;verticaloffset=0.1;g=false} @target

### Effect Bomb Attack
  
mini_you_archer_potion_activate:
  Skills:
  - freeze{ticks=30} @self 
  - look{headOnly=false;immediately=true} @target  
  - sound{s=item.armor.equip_leather;p=1.4;v=0.2} @self
  - state{state=throw;li=2;lo=4;n=false;speed=1} @self
  
  - delay 14
  - shoot{type=splash_potion;damage=6;onHit=mini_you_archer_potion_splash;onEnd=mini_you_archer_potion_splash;v=0.3;bounce=true} @target
  - sound{s=entity.witch.throw;p=0.3;v=0.2} @self
  
mini_you_archer_potion_splash:
  Skills:
  - sound{s=entity.splash_potion.break;p=1.3;v=0.4} 
  - damage{a=9} @LivingEntitiesInRadius{r=8;target=monsters}
  - effect:particles{particle=explosion_normal} @origin
  - potion{type=SLOW;duration=60;level=1} @LivingEntitiesInRadius{r=8;target=monsters}