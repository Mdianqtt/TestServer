# Cauldron of Death #

Cauldron_of_Death-1:
  Cooldown: 0
  Skills:
  - randomskill{skills=Slam,Goo_Eruption,Poison_Wisp}

Cauldron_of_Death-2:
  Cooldown: 0
  Skills:
  - randomskill{skills=Double_Slam,Wither_Goo_Eruption,Wither_Wisp}

# Slam #

Slam:
  Cooldown: 5
  Conditions:
  - offgcd
  - targetwithin{d=20} true
  - hasaurastacks{auraName=Cauldron_Stun_aura} false
  Skills:
  - gcd{ticks=80}
  - setAI{ai=false} @self
  - setAI{ai=true;delay=20} @self
  - potion{type=SLOW;duration=20;level=99;hasParticles=false} @self
  - state{s=jump_twice} @self
  - effect:sound{s=cod_sounds:samus.cod_attack;volume=1;pitch=1} @self
  - effect:sound{s=cod_sounds:samus.cod_jump;volume=1.5;pitch=1;delay=7} @self
  - effect:sound{s=cod_sounds:samus.cod_jump;volume=1.5;pitch=1;delay=14} @self
  - delay 20
  - Aura{auraName=Run_aura;interval=1;duration=40} @self
  - state{s=run;remove=true;delay=45} @self

Slam_RUN:
  Conditions:
  - targetwithin{d=6} castinstead Slam_RUN_STOP
  - hasaurastacks{auraName=Run_aura}
  - hasaurastacks{auraName=Cauldron_Stun_aura} false
  Skills:
  - look{headOnly=false;immediately=true} @target
  - delay 1
  - state{s=run} @self
  - lunge{velocity=0.4;velocityY=-0.5;repeatinterval=1;repeat=13} @forward{f=1;y=0}
  
  
Slam_RUN_STOP:
  Cooldown: 5
  Conditions:
  - hasaurastacks{auraName=Cauldron_Stun_aura} false
  Skills:
  - auraremove{aura=Run_aura} @self
  - state{s=run;remove=true} @self
  - skill{s=Cauldron_Stun;delay=48} 0.25
  - gcd{ticks=46}
  - setAI{ai=false} @self
  - setAI{ai=true;delay=46} @self
  - potion{type=SLOW;duration=46;level=99;hasParticles=false} @self
  - state{s=jump_slam} @self
  - effect:sound{s=cod_sounds:samus.cod_slam;volume=1;pitch=1} @self
  - delay 13
  - damage{a=14;pkb=false;hnp=false;hp=true} @PIR{r=7}
  - summon{type=Slam_FX;amount=1;radius=0;yRadius=0;onSurface=true} @self
  - effect:particles{particle=campfire_cosy_smoke;amount=10;hS=1.5;vS=0.15;y=0.2;speed=0;forwardOffset=0;sideOffset=0} @self

