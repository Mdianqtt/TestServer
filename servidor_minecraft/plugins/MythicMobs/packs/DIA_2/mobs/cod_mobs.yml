# Cauldron of Death #

Cauldron_of_Death:
  Type: ZOMBIFIED_PIGLIN
  Display: '&2Cauldron of Fatality'
  Health: 1000
  Damage: 12
  BossBar:
    Enabled: true
    Title: '&4Boiler of Death'
    Range: 38
    Color: RED
    Style: SEGMENTED_12
    DarkenSky: false
  Options:
    MovementSpeed: 0.25
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 48
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=cauldron_of_death;n=false;step=1} @self ~onSpawn
  - effect:sound{s=cod_sounds:samus.cod_idle;volume=1;pitch=1} @self ~onTimer:140 0.35
  - effect:sound{s=cod_sounds:samus.cod_idle;volume=1;pitch=1} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Slam_RUN} ~onTimer:13 >60%
  - skill{s=Double_Slam_RUN} ~onTimer:13 <60%
  - skill{s=Cauldron_Hit} @self ~onDamaged
  - skill{s=Cauldron_of_Death-1} ~onTimer:20 >60%
  - totem{md=40;c=7;oT=Poison_Aura_FX;oH=Poison_Aura_FX_POISON;hnp=false;hp=true;hR=3;vR=2;i=5} @selflocation ~onTimer:7 >60%
  - totem{md=40;c=7;oT=Wither_Aura_FX;oH=Wither_Aura_FX_WITHER;hnp=false;hp=true;hR=3;vR=2;i=5} @selflocation ~onTimer:7 <60%
  - skill{s=Cauldron_of_Death-2} ~onTimer:20 <60%
  - skill{s=CauldronOfDeath_Title} ~onDeath
  
Slam_FX:
  Type: ARMOR_STAND
  Pose:
      RightArm: 0,0,0
  Options:
    Marker: true
    Small: false
    HasArms: true
    Invisible: true
    Invincible: true
  Skills:
  - equip{item=slam_fx_1 HAND} @self ~onSpawn
  - equip{item=slam_fx_2 HAND;delay=1} @self ~onSpawn
  - equip{item=slam_fx_3 HAND;delay=2} @self ~onSpawn
  - equip{item=slam_fx_4 HAND;delay=3} @self ~onSpawn
  - equip{item=slam_fx_5 HAND;delay=4} @self ~onSpawn
  - equip{item=slam_fx_6 HAND;delay=5} @self ~onSpawn
  - remove{delay=6} @self ~onSpawn
  
