kriger:
  Type: IRON_GOLEM
  Display: 'Kriger' 
  Health: 1750
  Modules:
    ThreatTable: true
  AITargetSelectors:
  - players
  Options:
    MovementSpeed: .3
    PreventOtherDrops: true
    Despawn: true
    Persistent: false
    KnockbackResistance: 0.5
    Collidable: true
    Silent: true
    FollowRange: 32
  Skills:
  - skill{s=KRIGER_phantomarms_fx} @self ~onTimer:5
  - skill{s=KRIGER_invulnerable} @self ~onTimer:20
  - skill{s=KRIGER_summon_arms} @self ~onTimer:1
  - skill{s=KRIGER_sleep} @self ~onSpawn
  - skill{s=KRIGER_awaken} @self ~onTimer:20
  - skill{s=KRIGER_stun_hit} @self ~onDamaged
  - skill{s=KRIGER_stun_75} @self ~onDamaged <75%
  - skill{s=KRIGER_stun_50} @self ~onDamaged <50%
  - skill{s=KRIGER_stun_25} @self ~onDamaged <25%
  - skill{s=KRIGER_bossbar_damage} @self ~onDamaged
  - skill{s=KRIGER_deathbreath} @target ~onTimer:20
  - skill{s=KRIGER_leap} @self ~onTimer:20
  - skill{s=KRIGER_phantom_spin} @self ~onTimer:20
  - randomskill{skills=KRIGER_attack_1_sync,KRIGER_attack_2_sync,KRIGER_attack_3_sync;sync=true} @self ~onAttack
  - randomskill{skills=KRIGER_phantom_attack1_sync,KRIGER_phantom_attack2_sync;sync=true} @self ~onAttack
  - bodyclamp{mh=15;mb=15} @self ~onSpawn
  - model{mid=kriger} @self ~onSpawn
  - model{mid=kriger} @self ~onLoad  
  - skill{s=kriger_death} @self ~onDeath
  - skill{s=kriger_death_title} @self ~onDeath
  
KRIGER_concussion:
  Type: ARMOR_STAND
  Options:
    Marker: true
  Skills:
  - skill{s=KRIGER_concussion} @self ~onSpawn
  - model{mid=concussion;d=false;i=true} @self ~onSpawn
  - model{mid=concussion;d=false;i=true} @self ~onLoad  


