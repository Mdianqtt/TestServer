1bit_elite_pillager_pet:
  Type: skeleton
  Display: '&cElite Pillager Pet'
  Health: 40
  Damage: 5
  Faction: pet
  Options:
    Silent: true
    Invisible: true
    Collidable: true
    FollowRange: 15
    MovementSpeed: 0.28
    PreventSunburn: true
    PreventItemPickup: true
    PreventOtherDrops: true
    KnockbackResistance: 1
    Scale: 1
  AIGoalSelectors:
  - clear
  - rangedAttack{speed=1;smax=10;amin=10;radius=15}
  - lookAtTarget{r=15;h=true}
  - randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 monsters
  - 2 attacker
  Skills:
  - model{mid=1bit_elite_pillager;n=false;usestatemachine=true} @self ~onSpawn
  - BodyRotation{headuneven=true;maxhead=0;bodyuneven=true;minbody=0;maxbody=20;delay=1} @self ~onSpawn
  - model{mid=1bit_elite_pillager;n=false;usestatemachine=true} @self ~onLoad
  - BodyRotation{headuneven=true;maxhead=0;bodyuneven=true;minbody=0;maxbody=20;delay=1} @self ~onLoad
  - equip{item=BOW:HAND} @self ~onSpawn
  - equip{item=BOW:HAND} @self ~onLoad
  - addtag{t=pet} @self ~onSpawn
  - addtag{t=pet} @self ~onLoad
  - CancelEvent{sync=true} ~onShoot
  - CancelEvent{sync=true} ~onAttack
  - skill{s=1bit_elite_pillager_randoms_attack;sync=true} @target ~onShoot
  - onDamaged{auraName=spawn;cE=true;time=50;oS=[ 
      - stun{d=50;ai=true;g=true;f=true} @self
      - velocity{m=SET;x=0;y=0;z=0;repeat=50;repeatInterval=1} @self
    ]} @self ~onSpawn
  - CancelEvent{sync=true} ~onDamaged ?hasaura{n=spawn}
  - skill{s=[
      - sound{s=entity.pillager.ambient;p=0.90;v=1.0}
    ];sync=true} @self ~onTimer:60 ?chance{chance=0.75}
  - sound{s=entity.pillager.hurt;p=0.90;v=1.0} @self ~onDamaged
  - skill{s=1bit_elite_pillager_death;sync=true} @self ~onDeath
