Shadow_Active:
  Cooldown: 5
  Skills:
  - sound{s=entity.wither.shoot;p=0.5;v=1} @self
  - aura{
      i=1;
      d=160;
      onTick=Shadow_CloudTick;
      onEnd=Shadow_Explosion 
    } @self

Shadow_CloudTick:
  Skills:
  # 1. LA PARED FRONTAL (La barrera que predice tu movimiento)
  # Usamos f=0.8 para que la pared esté 0.8 bloques delante de ti.
  # width=2 y height=2 crean un plano de 2x2 metros frente a tu cara.
  - effect:particles{p=squid_ink;amount=1;hS=0.1;vS=0.1;speed=0} @Sphere{f=3.0;w=1;h=1;yo=1.6}
  
  # 2. EL RELLENO LATERAL (Para que no se vea plano desde los lados)
  # Usamos @RandomLocationsNearCaster (RLNC) para rellenar el volumen alrededor
  - effect:particles{p=large_smoke;amount=10;hS=0.5;vS=0.5;speed=0.01} @RLNC{radius=1;points=5;yo=1.0}
  
  # 3. EL NÚCLEO (Para que tú mismo te veas envuelto)
  - effect:particles{p=ash;amount=10;hS=0.3;vS=0.3;speed=0} @self{yo=1.5}

  # Efectos pasivos
  - skill{s=Shadow_Effects} @self ~onTimer:5

Shadow_Effects:
  Skills:
  - potion{type=BLINDNESS;duration=40;level=1} @EntitiesInRadius{r=4;ignore=@Players}
  - potion{type=SLOW;duration=40;level=3} @EntitiesInRadius{r=4;ignore=@Players}
  - potion{type=INVISIBILITY;duration=20;level=1;showParticles=false} @self

Shadow_Explosion:
  Skills:
  # Visual de explosión seguro
  - effect:particles{p=large_smoke;amount=80;hS=1.5;vS=1.5;speed=0.1} @self
  - effect:particles{p=explode;amount=1} @self
  
  # Sonidos universales
  - sound{s=entity.generic.explode;p=0.5;v=1} @self
  - sound{s=entity.wither.death;p=1.5;v=1} @self

  # Mecánica de empuje (Asegúrate de que 'throw' esté disponible, si no, usa 'velocity')
  - velocity{x=0;y=0.8;z=0;repeat=0;force=true} @EntitiesInRadius{r=6;ignore=@Players}
  - damage{amount=6} @EntitiesInRadius{r=6;ignore=@Players}
  - potion{type=BLINDNESS;duration=100;level=1} @EntitiesInRadius{r=6;ignore=@Players}


  # SHURIKEN DE FUEGO---------------------


Shuriken_Lanzamiento:
  Cooldown: 0.5
  Skills:
  - consumeuseditem @self
  - sound{s=entity.snowball.throw;p=0.5;v=1} @self
  # Usamos missile para que sea un proyectil físico y veloz
  - missile{
      onTick=Shuriken_Tick;
      onHit=Shuriken_Estallido;
      onHitBlock=Shuriken_Estallido;
      v=30;
      i=1;
      maxDistance=40;
      raySize=0.5;
      ignorepassable=true;
      startOffset=1.5;
    } @Forward{length=40}

Shuriken_Tick:
  Skills:
  - effect:particles{p=flame;amount=3;hS=0.1;vS=0.1;speed=0.02} @origin
  - effect:particles{p=large_smoke;amount=1;hS=0.05;vS=0.05;speed=0} @origin

Shuriken_Estallido:
  Skills:
  - sound{s=item.firecharge.use;p=0.5;v=2} @origin
  # 1. Círculo Central
  - skill{s=Shuriken_Circulo_Madre} @origin
  
  # 2. Forzamos los hijos usando direcciones relativas simples
  # Esto le dice: "Vete 6 bloques hacia adelante/atrás/lado y crea el hijo"
  - skill{s=Shuriken_Circulo_Hijo} @Forward{length=6}

# --- EL CÍRCULO GRANDE (Radio 4) ---
Shuriken_Circulo_Madre:
  Skills:
  - effect:particles{p=flame;amount=40;hS=0.1;vS=0.1;speed=0.1} @RingAroundOrigin{r=4;points=30}
  - orbital{onTick=Shuriken_Fuego_Efecto;points=6;duration=40;radius=4;velocity=0} @origin
  - skill{s=Shuriken_Fuego_Efecto} @origin

# --- LOS CÍRCULOS PEQUEÑOS (Radio 2) ---
Shuriken_Circulo_Hijo:
  Skills:
  - effect:particles{p=flame;amount=20;hS=0.1;vS=0.1;speed=0.1} @RingAroundOrigin{r=2;points=15}
  - orbital{onTick=Shuriken_Fuego_Efecto;points=4;duration=40;radius=2;velocity=0} @origin
  - skill{s=Shuriken_Fuego_Efecto} @origin

# --- EL EFECTO DE FUEGO ---
Shuriken_Fuego_Efecto:
  Skills:
  - effect:particles{p=flame;amount=5;hS=0.2;vS=0.4;speed=0.05} @origin
  - damage{a=2} @EntitiesNearOrigin{r=2.0;ignore=players}
  - ignite{d=40} @EntitiesNearOrigin{r=2.0;ignore=players}